
networks:
  minio_network:

services:

  editor:
    image: 'gorules/editor'
    platform: linux/amd64
    ports:
      - '3000:3000'

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - '9001:9000'
      - '9002:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Dev-only KMS key enabling SSE-S3 (AES256) encryption.
      # Format: key-name:base64(32-byte key)
      # This is NOT a production secret — it exists solely to satisfy MinIO's
      # KMS requirement in the local dev and e2e test environment.
      MINIO_KMS_SECRET_KEY: "dev-key:ZGVjaXNpb24tZW5naW5lLWRldi1rbXMta2V5LTEyMzQ="
    # tmpfs: mounts /data as an in-memory filesystem so MinIO's minimum free
    # drive threshold check passes even when the host overlay filesystem is
    # near capacity (common in dev containers and CI environments).
    tmpfs:
      - /data
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - minio_network

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/analytics-data;
      mc mb --ignore-existing local/crif-cache;
      exit 0;
      "
    networks:
      - minio_network

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - '6380:6379'
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minio_network